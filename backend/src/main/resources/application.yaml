spring:
  config:
    # Local secrets (gitignored); see backend/application-local.yaml
    # Checked from backend/ (gradlew bootRun) and from the repo root (IntelliJ's default working dir)
    import: optional:file:./application-local.yaml,optional:file:./backend/application-local.yaml
  profiles:
    active: prod
  application:
    name: steam-companion-backend
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/steam_companion}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    # Base64-encoded, at least 32 bytes. No default on purpose: startup fails if it's missing.
    # Generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    access-token:
      expiration: ${JWT_EXPIRATION:900000} # 15 minutes in milliseconds; the frontend refreshes it
    refresh-token:
      expiration: 2592000000  # 30 days in milliseconds
  steam:
    apiKey: ${STEAM_API_KEY}
    openid:
      realm: ${STEAM_OPENID_REALM:http://localhost:8080}
      return-to: ${STEAM_OPENID_RETURN_TO:http://localhost:8080/api/auth/steam/callback}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cookie:
    # Lax blocks auth cookies on cross-site POSTs (CSRF). Use None only if the frontend
    # is served from a different site than the API.
    same-site: ${COOKIE_SAME_SITE:Lax}

