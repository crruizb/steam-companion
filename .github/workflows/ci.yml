name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      # Integration tests start Postgres with Testcontainers, using the runner's Docker
      - name: Build and test with Gradle
        working-directory: backend
        run: ./gradlew clean build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: backend/build/libs/*.jar
          retention-days: 3

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  deploy:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: backend
    # Only publish images from main, never from pull requests or other branches
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: backend/build/libs/

      - name: Get image tags
        run: |
          echo "IMAGE_TAG=$(date -u +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags: <build date>-<commit SHA> and latest. The date prefix lets Flux
      # pick the newest image; the SHA says which code it contains
      - name: Build and push Docker image
        working-directory: backend
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/steamcompanion
          docker build -t $IMAGE:$IMAGE_TAG -t $IMAGE:latest .
          docker push $IMAGE:$IMAGE_TAG
          docker push $IMAGE:latest
